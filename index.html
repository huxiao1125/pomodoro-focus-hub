<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Focus Hub - 沉浸式番茄钟</title>
  <meta name="description" content="极简未来感番茄工作法时钟，原生Web Audio算法合成白噪音与禅意提示音，助你高效专注。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <div class="logo-icon">🍅</div>
        <span>FocusHub</span>
      </div>
      <div class="header-actions">
        <button id="theme-btn" class="icon-btn" title="切换主题色彩" aria-label="切换主题">🎨</button>
        <button id="stats-btn" class="icon-btn" title="专注统计" aria-label="统计">📊</button>
        <button id="settings-btn" class="icon-btn" title="偏好设置" aria-label="设置">⚙️</button>
      </div>
    </header>

    <!-- Mode Selector Tabs -->
    <nav class="mode-tabs" role="tablist">
      <button id="tab-focus" class="mode-tab active" data-mode="focus" role="tab" aria-selected="true">专注 25m</button>
      <button id="tab-short-break" class="mode-tab" data-mode="shortBreak" role="tab" aria-selected="false">短休息 5m</button>
      <button id="tab-long-break" class="mode-tab" data-mode="longBreak" role="tab" aria-selected="false">长休息 15m</button>
    </nav>

    <!-- Main Focus Area -->
    <main class="focus-card" id="focus-card">
      <!-- Circular SVG Timer -->
      <div class="timer-container">
        <svg class="timer-svg" viewBox="0 0 300 300">
          <circle class="timer-circle-bg" cx="150" cy="150" r="130"></circle>
          <circle id="timer-progress" class="timer-circle-progress" cx="150" cy="150" r="130"
                  stroke-dasharray="816.8" stroke-dashoffset="0"></circle>
        </svg>

        <div class="timer-display">
          <div id="time-display" class="time-text">25:00</div>
          <div id="mode-text" class="mode-label">专注模式</div>
          <div class="session-dots" id="session-dots" title="第 1 轮专注周期 (共4轮)">
            <span class="session-dot filled"></span>
            <span class="session-dot"></span>
            <span class="session-dot"></span>
            <span class="session-dot"></span>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="controls">
        <button id="reset-btn" class="btn-secondary" title="重置当前计时 (快捷键 R)" aria-label="重置">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>

        <button id="toggle-btn" class="btn-primary" aria-label="开始计时">
          <span id="toggle-icon">▶</span>
          <span id="toggle-text">开始专注</span>
        </button>

        <button id="skip-btn" class="btn-secondary" title="跳过当前阶段 (快捷键 S)" aria-label="跳过">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>
      </div>

      <!-- Current Focus Objective Bar -->
      <div class="task-container">
        <div class="task-box">
          <span class="task-icon">🎯</span>
          <input type="text" id="task-input" class="task-input" placeholder="输入此刻你想专注完成的目标..." maxlength="50">
        </div>
      </div>
    </main>

    <!-- Sound & Ambience Panel -->
    <section class="sound-panel">
      <div class="sound-chips">
        <button class="sound-chip active" data-sound="none">静音</button>
        <button class="sound-chip" data-sound="rain">🌧️ 细雨</button>
        <button class="sound-chip" data-sound="waves">🌊 海浪</button>
        <button class="sound-chip" data-sound="pink">🎧 粉噪</button>
      </div>
      <div class="volume-control" title="环境音量">
        <span>🔊</span>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.4">
      </div>
    </section>

    <!-- Footer Shortcuts -->
    <footer class="app-footer">
      <span><span class="kbd-badge">Space</span> 开始/暂停</span>
      <span><span class="kbd-badge">R</span> 重置</span>
      <span><span class="kbd-badge">S</span> 下一阶段</span>
    </footer>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">偏好设置</h2>
        <button id="close-settings-btn" class="icon-btn" aria-label="关闭设置">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">时长配置 (单位: 分钟)</label>
        <div class="form-input-row">
          <div class="num-input-wrap">
            <label for="setting-focus">专注</label>
            <input type="number" id="setting-focus" class="modal-input" min="1" max="90" value="25">
          </div>
          <div class="num-input-wrap">
            <label for="setting-short">短休息</label>
            <input type="number" id="setting-short" class="modal-input" min="1" max="30" value="5">
          </div>
          <div class="num-input-wrap">
            <label for="setting-long">长休息</label>
            <input type="number" id="setting-long" class="modal-input" min="1" max="60" value="15">
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">长休息周期</label>
        <div class="num-input-wrap">
          <input type="number" id="setting-cycle" class="modal-input" min="2" max="10" value="4">
        </div>
      </div>
      <button id="save-settings-btn" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
        保存设置
      </button>
    </div>
  </div>

  <!-- Stats Modal -->
  <div id="stats-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">专注统计</h2>
        <button id="close-stats-btn" class="icon-btn" aria-label="关闭统计">✕</button>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div id="stat-total-tomatoes" class="stat-val">0</div>
          <div class="stat-label">今日完成番茄数</div>
        </div>
        <div class="stat-card">
          <div id="stat-focus-time" class="stat-val">0h 0m</div>
          <div class="stat-label">累计专注时长</div>
        </div>
      </div>
      <div class="stat-card" style="text-align: left; padding: 14px 18px;">
        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px;">💡 专注小贴士</div>
        <div style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;">
          每完成 4 个番茄钟，建议进行一次 15-30 分钟的充分放松。离开屏幕活动身体，有助于恢复大脑活力！
        </div>
      </div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
